name: RAGAS Eval Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for keyless GCP auth (Workload Identity Federation)

jobs:
  eval:
    runs-on: ubuntu-latest
    # Spins an ephemeral RAG stack (pgvector + API) inside the runner, seeds it
    # with fixture docs, then scores it with RAGAS. Embeddings, generation, and
    # the judge all run on Vertex AI — authenticated via WIF, no API keys.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finops_rag
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raguser -d finops_rag"
          --health-interval 5s --health-retries 10

    env:
      DB_HOST: localhost
      DB_PASSWORD: ci
      RAG_API_URL: http://localhost:8080
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}

    steps:
      - uses: actions/checkout@v4

      # Keyless auth via Workload Identity Federation; the two repo variables
      # are terraform outputs ci_wif_provider / ci_sa_email. Must run before
      # anything that touches Vertex AI.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -r rag/requirements.txt -r evals/requirements.txt

      - name: Start RAG API
        run: |
          uvicorn rag.api:app --port 8080 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 2; done

      - name: Seed fixture corpus
        run: python -m evals.seed_fixtures

      - name: Run RAGAS evals
        run: python -m evals.run_evals --threshold-faithfulness 0.85

      - name: Log results to BigQuery
        # hashFiles guards the case where the eval step died before writing a report
        if: always() && hashFiles('eval_results.json') != ''
        run: python -m evals.log_results eval_results.json

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_results.json
