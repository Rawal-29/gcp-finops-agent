name: RAGAS Eval Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for keyless GCP auth (Workload Identity Federation)

jobs:
  eval:
    runs-on: ubuntu-latest
    # Spins an ephemeral RAG stack (pgvector + API) inside the runner,
    # seeds it with fixture docs, then scores it with RAGAS.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finops_rag
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raguser -d finops_rag"
          --health-interval 5s --health-retries 10

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DB_HOST: localhost
      DB_PASSWORD: ci
      RAG_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -r rag/requirements.txt -r evals/requirements.txt

      - name: Start RAG API
        run: |
          uvicorn rag.api:app --port 8080 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 2; done

      - name: Seed fixture corpus
        run: python -m evals.seed_fixtures

      - name: Run RAGAS evals
        run: python -m evals.run_evals --threshold-faithfulness 0.85

      # Keyless auth via Workload Identity Federation; the two secrets are
      # terraform outputs ci_wif_provider / ci_sa_email. Skipped when unset.
      - name: Authenticate to GCP
        id: gcp_auth
        if: always() && github.event_name == 'pull_request' && vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}

      - name: Log results to BigQuery
        if: always() && steps.gcp_auth.outcome == 'success'
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: python -m evals.log_results eval_results.json

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_results.json
