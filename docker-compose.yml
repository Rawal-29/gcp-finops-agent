# Local dev: pgvector Postgres + API. `docker compose up`
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: finops_rag
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d finops_rag"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: rag/Dockerfile
    environment:
      DB_HOST: db
      DB_PASSWORD: localdev
      GCP_PROJECT: ${GCP_PROJECT:?set to your GCP project for Vertex AI}
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
    volumes:
      # Vertex AI auth: your local gcloud ADC, read-only
      - ~/.config/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
